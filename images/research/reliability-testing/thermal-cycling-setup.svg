<title>Thermal cycling setup and profile: devices sit on a cooling plate above a Peltier module and heat sink, with a temperature controller driving the Peltier module from a thermocouple on the plate; the plate temperature cycles between a minimum and a maximum, with ramps and a dwell at each extreme</title>
