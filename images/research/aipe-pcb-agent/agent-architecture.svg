<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 668" width="760" height="668" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>AIPE PCB Agent architecture: requirement files and an engineering knowledge base feed a shared circuit model and design rules, which drive schematic generation and board construction; native KiCad checks and layout checks feed findings back, and verified projects are exported with hashed manifests for the AIPE workflow and human review</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8288"/></marker></defs>
<g text-anchor="middle">
<rect x="40" y="16" width="310" height="80" rx="6" fill="#ffffff" stroke="#bdc1c4"/>
<text x="195" y="40" font-size="15" font-weight="700" fill="#494e52">Requirement files</text>
<text x="195" y="62" font-size="12.5" fill="#7a8288">specification, insulation table, stack-ups</text>
<text x="195" y="82" font-size="12.5" fill="#7a8288">components, interface pin maps, floorplan</text>
<rect x="370" y="16" width="310" height="80" rx="6" fill="#ffffff" stroke="#bdc1c4"/>
<text x="525" y="40" font-size="15" font-weight="700" fill="#494e52">Engineering knowledge base</text>
<text x="525" y="62" font-size="12.5" fill="#7a8288">design skills, circuit blocks, component records</text>
<text x="525" y="82" font-size="12.5" fill="#7a8288">layout and insulation rules with sources</text>
</g>
<rect x="24" y="116" width="712" height="452" rx="8" fill="#eef7fa" stroke="#52adc8" stroke-width="2"/>
<text x="360" y="138" font-size="13" font-weight="700" fill="#52adc8" text-anchor="middle">AIPE PCB Agent · Python automation on KiCad 10</text>
<g text-anchor="middle">
<rect x="40" y="148" width="640" height="72" rx="6" fill="#ffffff" stroke="#bdc1c4"/>
<text x="360" y="172" font-size="15" font-weight="700" fill="#494e52">Shared circuit model and design rules</text>
<text x="360" y="194" font-size="12.5" fill="#7a8288">parts, typed pins, pad-to-net connections and functional blocks</text>
<text x="360" y="212" font-size="12.5" fill="#7a8288">net classes and KiCad rule file derived from the insulation table</text>
<rect x="40" y="252" width="310" height="100" rx="6" fill="#ffffff" stroke="#bdc1c4"/>
<text x="195" y="276" font-size="15" font-weight="700" fill="#494e52">Schematic generation</text>
<text x="195" y="298" font-size="12.5" fill="#7a8288">functional-group sheet planner</text>
<text x="195" y="318" font-size="12.5" fill="#7a8288">sheet router and connectivity guard</text>
<text x="195" y="338" font-size="12.5" fill="#7a8288">hierarchical sheets and project libraries</text>
<rect x="370" y="252" width="310" height="100" rx="6" fill="#ffffff" stroke="#bdc1c4"/>
<text x="525" y="276" font-size="15" font-weight="700" fill="#494e52">Board construction</text>
<text x="525" y="298" font-size="12.5" fill="#7a8288">stack-up, footprints and board outline</text>
<text x="525" y="318" font-size="12.5" fill="#7a8288">insulation-aware placement, copper zones</text>
<text x="525" y="338" font-size="12.5" fill="#7a8288">deterministic grid router</text>
<rect x="40" y="384" width="640" height="72" rx="6" fill="#ffffff" stroke="#bdc1c4"/>
<text x="360" y="408" font-size="15" font-weight="700" fill="#494e52">Verification</text>
<text x="360" y="430" font-size="12.5" fill="#7a8288">native kicad-cli ERC and DRC with schematic parity</text>
<text x="360" y="448" font-size="12.5" fill="#7a8288">netlist equality, routing quality, layout metrics and copper islands</text>
<rect x="40" y="480" width="640" height="72" rx="6" fill="#ffffff" stroke="#bdc1c4"/>
<text x="360" y="504" font-size="15" font-weight="700" fill="#494e52">Exports and records</text>
<text x="360" y="526" font-size="12.5" fill="#7a8288">KiCad projects, schematic and layout PDFs, 3D views</text>
<text x="360" y="544" font-size="12.5" fill="#7a8288">Gerber, drill, BOM, placement and STEP files with SHA-256 manifests</text>
<rect x="40" y="596" width="640" height="56" rx="6" fill="#f2f3f3" stroke="#bdc1c4"/>
<text x="360" y="620" font-size="15" font-weight="700" fill="#494e52">Hand-off</text>
<text x="360" y="640" font-size="12.5" fill="#7a8288">AIPE-Workflows CAD/PCB gate, then human engineering review</text>
</g>
<g stroke="#7a8288" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
<line x1="195" y1="96" x2="195" y2="146"/>
<line x1="525" y1="96" x2="525" y2="146"/>
<line x1="195" y1="220" x2="195" y2="250"/>
<line x1="525" y1="220" x2="525" y2="250"/>
<line x1="195" y1="352" x2="195" y2="382"/>
<line x1="525" y1="352" x2="525" y2="382"/>
<line x1="360" y1="456" x2="360" y2="478"/>
<line x1="360" y1="552" x2="360" y2="594"/>
<path d="M680,420 H706 V184 H682"/>
<line x1="706" y1="302" x2="682" y2="302"/>
</g>
<text x="723" y="302" font-size="12.5" fill="#7a8288" text-anchor="middle" transform="rotate(90 723 302)">findings: revise model, placement or routing</text>
</svg>
