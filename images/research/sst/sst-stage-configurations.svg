<text x="385.0" y="92.0" font-size="12" fill="#7a8288" text-anchor="middle">direct conversion through a high-frequency transformer</text>
<line x1="690" y1="76.0" x2="712" y2="76.0" stroke="#7a8288" stroke-width="1.5"/>
<text x="20" y="152" font-size="14.5" font-weight="700" fill="#494e52">Two-stage SST</text><text x="139" y="152" font-size="12.5" fill="#7a8288">one DC link</text>
<text x="38" y="199.0" font-size="13" fill="#494e52" text-anchor="middle">MV AC</text>
<text x="733" y="199.0" font-size="13" fill="#494e52" text-anchor="middle">LV AC</text>
<line x1="60" y1="194.0" x2="80" y2="194.0" stroke="#7a8288" stroke-width="1.5"/>
<rect x="80" y="166" width="390" height="56" rx="6" fill="#ffffff" stroke="#bdc1c4"/>
<text x="275.0" y="191.0" font-size="14" font-weight="700" fill="#494e52" text-anchor="middle">Isolated AC–DC converter</text>
<text x="275.0" y="210.0" font-size="12" fill="#7a8288" text-anchor="middle">rectifier with high-frequency transformer</text>
