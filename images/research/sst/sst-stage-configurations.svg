<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 374" width="760" height="374" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Single-stage, two-stage and three-stage solid-state transformer configurations between the medium-voltage and low-voltage AC grids, distinguished by having no DC link, one DC link, or both high-voltage and low-voltage DC links</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8288"/></marker></defs>
<text x="20" y="34" font-size="14.5" font-weight="700" fill="#494e52">Single-stage SST</text><text x="164" y="34" font-size="12.5" fill="#7a8288">no DC link</text>
<text x="38" y="81.0" font-size="13" fill="#494e52" text-anchor="middle">MV AC</text>
<text x="733" y="81.0" font-size="13" fill="#494e52" text-anchor="middle">LV AC</text>
<line x1="60" y1="76.0" x2="80" y2="76.0" stroke="#7a8288" stroke-width="1.5"/>
