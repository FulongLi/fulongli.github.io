<line x1="501.0" y1="180.0" x2="501.0" y2="208.0" stroke="#52adc8" stroke-width="2.6"/><line x1="509.0" y1="180.0" x2="509.0" y2="208.0" stroke="#52adc8" stroke-width="2.6"/>
<text x="505.0" y="238" font-size="12" font-weight="700" fill="#52adc8" text-anchor="middle">LV DC</text>
<rect x="540" y="166" width="150" height="56" rx="6" fill="#ffffff" stroke="#bdc1c4"/>
<text x="615.0" y="199.0" font-size="14" font-weight="700" fill="#494e52" text-anchor="middle">DC–AC inverter</text>
