<text x="405.0" y="309.0" font-size="14" font-weight="700" fill="#494e52" text-anchor="middle">Isolated DC–DC</text>
<text x="405.0" y="328.0" font-size="12" fill="#7a8288" text-anchor="middle">DAB, HF transformer</text>
