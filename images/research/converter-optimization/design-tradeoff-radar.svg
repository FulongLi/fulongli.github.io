<circle cx="351.9" cy="254.9" r="4" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/>
<circle cx="300.0" cy="362.7" r="4" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/>
<circle cx="173.8" cy="297.8" r="4" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/>
<circle cx="172.5" cy="151.4" r="4" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/>
<text x="300" y="430" font-size="12" fill="#7a8288" text-anchor="middle">outward is better on every axis; each axis is scaled across the Pareto front</text>
<text x="560" y="128" font-size="13" font-weight="700" fill="#494e52">Design</text>
<line x1="560" y1="146" x2="584" y2="146" stroke="#2a78d6" stroke-width="3"/><circle cx="572" cy="146" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<text x="592" y="150" font-size="13" fill="#494e52"><tspan font-weight="700">A</tspan> High efficiency</text>
<text x="592" y="167" font-size="12" fill="#7a8288">98.8% · 2.2 kW/dm³ · 62 kHz</text>
<line x1="560" y1="190" x2="584" y2="190" stroke="#eb6834" stroke-width="3"/><circle cx="572" cy="190" r="4" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
<text x="592" y="194" font-size="13" fill="#494e52"><tspan font-weight="700">B</tspan> Balanced</text>
<text x="592" y="211" font-size="12" fill="#7a8288">97.6% · 6.8 kW/dm³ · 220 kHz</text>
<line x1="560" y1="234" x2="584" y2="234" stroke="#1baf7a" stroke-width="3"/><circle cx="572" cy="234" r="4" fill="#1baf7a" stroke="#ffffff" stroke-width="2"/>
<text x="592" y="238" font-size="13" fill="#494e52"><tspan font-weight="700">C</tspan> High power density</text>
<text x="592" y="255" font-size="12" fill="#7a8288">96.9% · 8.8 kW/dm³ · 289 kHz</text>
