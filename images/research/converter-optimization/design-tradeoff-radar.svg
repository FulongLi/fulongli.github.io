<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Radar comparison of three Pareto-optimal designs on efficiency, power density, semiconductor loss and switch, inductor and capacitor volume: design A leads on efficiency and semiconductor loss, design C on power density and passive-component size, and design B lies between them</title>
<polygon points="300.0,187.5 332.5,206.2 332.5,243.8 300.0,262.5 267.5,243.8 267.5,206.2" fill="none" stroke="#e6e8e9" stroke-width="1"/>
<polygon points="300.0,150.0 365.0,187.5 365.0,262.5 300.0,300.0 235.0,262.5 235.0,187.5" fill="none" stroke="#e6e8e9" stroke-width="1"/>
<polygon points="300.0,112.5 397.4,168.8 397.4,281.2 300.0,337.5 202.6,281.3 202.6,168.8" fill="none" stroke="#e6e8e9" stroke-width="1"/>
<polygon points="300.0,75.0 429.9,150.0 429.9,300.0 300.0,375.0 170.1,300.0 170.1,150.0" fill="none" stroke="#e6e8e9" stroke-width="1"/>
<line x1="300" y1="225" x2="300.0" y2="75.0" stroke="#e6e8e9" stroke-width="1"/>
<text x="300.0" y="53.0" font-size="13" fill="#494e52" text-anchor="middle">Efficiency</text>
<line x1="300" y1="225" x2="429.9" y2="150.0" stroke="#e6e8e9" stroke-width="1"/>
<text x="445.5" y="146.0" font-size="13" fill="#494e52" text-anchor="start">Power density</text>
<line x1="300" y1="225" x2="429.9" y2="300.0" stroke="#e6e8e9" stroke-width="1"/>
<text x="445.5" y="314.0" font-size="13" fill="#494e52" text-anchor="start">Low semiconductor loss</text>
<line x1="300" y1="225" x2="300.0" y2="375.0" stroke="#e6e8e9" stroke-width="1"/>
<text x="300.0" y="407.0" font-size="13" fill="#494e52" text-anchor="middle">Small switches</text>
<line x1="300" y1="225" x2="170.1" y2="300.0" stroke="#e6e8e9" stroke-width="1"/>
<text x="154.5" y="323.0" font-size="13" fill="#494e52" text-anchor="end">Small inductor</text>
<line x1="300" y1="225" x2="170.1" y2="150.0" stroke="#e6e8e9" stroke-width="1"/>
<text x="154.5" y="137.0" font-size="13" fill="#494e52" text-anchor="end">Small capacitor</text>
<polygon points="300.0,80.5 328.3,208.7 425.5,297.5 300.0,288.8 240.0,259.7 222.3,180.1" fill="#2a78d6" fill-opacity="0.10" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"/>
<circle cx="300.0" cy="80.5" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<circle cx="328.3" cy="208.7" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<circle cx="425.5" cy="297.5" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<circle cx="300.0" cy="288.8" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<circle cx="240.0" cy="259.7" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<circle cx="222.3" cy="180.1" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<polygon points="300.0,132.8 389.1,173.5 379.1,270.6 300.0,350.2 181.6,293.4 175.7,153.3" fill="#eb6834" fill-opacity="0.10" stroke="#eb6834" stroke-width="2" stroke-linejoin="round"/>
