<circle cx="389.1" cy="173.5" r="4" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
<circle cx="379.1" cy="270.6" r="4" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
<circle cx="300.0" cy="350.2" r="4" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
<circle cx="181.6" cy="293.4" r="4" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
<circle cx="175.7" cy="153.3" r="4" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
<polygon points="300.0,164.5 416.1,157.9 351.9,254.9 300.0,362.7 173.8,297.8 172.5,151.4" fill="#1baf7a" fill-opacity="0.10" stroke="#1baf7a" stroke-width="2" stroke-linejoin="round"/>
