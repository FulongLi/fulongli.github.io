<title>Three-dimensional sketch of four PCB Rogowski winding patterns, each with five turns between the top and bottom layers joined by vias: fishbone, whose turns stand perpendicular to the coil path and are joined by short steps, with a return line; saw, whose bottom-layer traces slant to the next turn; triangle, whose traces slant on both layers; and fishbone without a return line</title>
