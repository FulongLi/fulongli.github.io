    url: /research/aipe/#open-source-engineering-tools-and-resources
    page: /research/aipe/
    summary: >-
      Public repositories that package device models, converter optimisation
      and design examples so they can be inspected and reused.
    role: "Author and maintainer of the public repositories"
    setting: "Independent open-source work"
    work: [modelling, design]
    evidence: [code]

