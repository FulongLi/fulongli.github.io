# Research portfolio registry.
#
# One entry per project or research stream. The Research landing page renders
# the cards from this file, and each project page renders its "At a glance"
# panel from the entries whose `page` matches the page URL.
#
# Labels must describe verified facts only:
#   work      - what kind of work was done (see work_types)
#   evidence  - what a visitor can check (see evidence_levels)
#   review    - true while publication rights for the detailed material are
#               being confirmed with the owner; the page then shows a neutral
#               summary only.

work_types:
  design: "Design"
  hardware: "Hardware prototype"
  simulation: "Simulation"
  modelling: "Modelling"
  optimisation: "Optimisation"
  experimental: "Experimental"
  test-rig: "Test rig"
  review: "Technical review"
  lead: "Technical lead"

evidence_levels:
  published: "Peer-reviewed publication"
  thesis: "PhD thesis"
  preprint: "Preprint"
  code: "Public code or design files"
  cv: "Summarised in public CV"
  internal: "Internal project reports (summary only)"
  pending: "Details to be confirmed"

areas:
  - id: aipe
    number: "01"
    title: "AIPE: AI for Power Engineering"
    url: /research/aipe/
    description: >-
      Data-driven models and open engineering tools that sit on top of the
      component and converter work: neural-network device models, surrogate
      models for converter optimisation, and public datasets and code.
  - id: components
    number: "02"
    title: "Components"
    url: /research/switching_devices/
    description: >-
      Power semiconductor characterisation and reliability testing,
      PCB-integrated current sensors for fast-switching SiC converters, and
      the device loss and thermal models that feed converter design.
  - id: converters
    number: "03"
    title: "Converters"
    url: /research/isolated_converters/
    description: >-
      Isolated and non-isolated DC–DC converter design and control, converter
      stability with passivity-based compensation, wireless power transfer,
      and multi-objective converter design optimisation.
  - id: microgrids
    number: "04"
    title: "Microgrids & Energy Systems"
    url: /research/dcmg/
    description: >-
      Hierarchical control of low-voltage DC microgrids, PV and battery
      integration, laboratory DC microgrid platforms, and system-level energy
      management for buildings and a marine fuel-cell powertrain.

projects:
